[project.urls]
Repository = "https://github.com/sblaplace/aqueous_electrowinning_steel"
Issues = "https://github.com/sblaplace/aqueous_electrowinning_steel/issues"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -n auto"
markers = [
    "slow: long-running full-fidelity tests (sweeps, Monte Carlo, Sobol, Bayesian/EIS, optimization, benchmarks). Run on demand per docs/TESTING.md, not in the fast feedback loop.",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501"]  # line length handled by formatter line-length


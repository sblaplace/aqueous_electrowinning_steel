[project]
name = "aqueous-electrowinning-steel"
version = "0.5.0"
description = "Aqueous electrowinning for sustainable steel — thermodynamics, kinetics, transport, cell architecture, adhesion/peel, pulse, co-deposition, mechanical, carburization, tempering, surface-state HER chemistry, chloride speciation, techno-economics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Aqueous Electrowinning Research Collective"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "seaborn>=0.12",
    "pint>=0.22",
    "pyyaml>=6.0",
    "numba>=0.60",
    "scikit-optimize>=0.10",
]

[project.optional-dependencies]
jupyter = ["jupyter>=1.0", "ipykernel>=6.0"]
test = ["pytest>=7.0", "pytest-xdist>=3.0", "pytest-benchmark>=4.0"]
all = ["jupyter>=1.0", "ipykernel>=6.0", "pytest>=7.0", "pytest-benchmark>=4.0", "seaborn>=0.12", "pint>=0.22"]

[project.scripts]
aq-steel = "models.run_all:cli"

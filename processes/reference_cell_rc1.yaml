# RC-1 nominal geometry and balance-of-plant design inputs.
# Status: pre-procurement basis, not as-built configuration or experimental evidence.
# Human-readable rationale and required verification: docs/REFERENCE_CELL_DESIGN_BASIS.md
schema_version: "0.1"
configuration_id: "RC-1"
status: "pre-procurement"

# Initial chemistry and operating setpoint used by the design-synthesis runner.
# These are screening inputs to be replaced by fitted values after RC-1 data exists.
chemistry:
  bath:
    fe_so4_M: 1.0
    na2_so4_M: 0.0
    h2_so4_M: 0.01
    h3_bo3_M: 0.4
    bulk_pH: 2.0
  transport:
    nominal_boundary_layer_um: 50.0
  kinetics:
    fe_i0_A_m2: 0.01
    her_i0_A_m2: 1.0e-6
    fe_tafel_V_dec: 0.12
    her_tafel_V_dec: 0.14

cell_stack:
  cathode:
    material: "316L stainless-steel coupon"
    thickness_mm: 1.0
    active_length_mm: 50.0
    active_width_mm: 20.0
    active_area_cm2: 10.0
    surface_preparation: "controlled and recorded per run; not yet frozen"
  anode:
    # Explicit mode prevents a soluble-Fe experiment from silently using the
    # inert/OER voltage and gas assumptions.  Material remains campaign-
    # controlled until the first anode comparison is complete.
    chemistry: "inert"
    material: "specified OER-capable or experimental anode; controlled per campaign"
    minimum_exposed_area_cm2: 10.0
  membrane:
    initial_comparator: "Nafion N117"
    nominal_wetted_length_mm: 50.0
    nominal_wetted_width_mm: 50.0
    cassette: "removable clamped cassette with replaceable compatible gasket"
  channels:
    orientation: "vertical"
    inlet_location: "bottom"
    outlet_location: "top"
    cathode:
      length_mm: 50.0
      width_mm: 20.0
      depth_mm: 3.0
    anode:
      length_mm: 50.0
      width_mm: 20.0
      depth_mm: 3.0
  wetted_materials_allowed:
    - "borosilicate"
    - "polypropylene"
    - "PVDF"
    - "PTFE"
    - "FEP"
    - "EPDM or Viton only after compatibility review"
  construction_constraints:
    - "No unqualified metal, adhesive, or 3-D-print resin in contact with hot acidic electrolyte."
    - "Gasket compression stops must preserve channel depth and exposed area."

balance_of_plant:
  catholyte_volume_L: 1.0
  anolyte_volume_L: 1.0
  recirculation:
    independent_loops: true
    installed_flow_range_L_min: [0.1, 1.0]
    required_measurements: ["flow rate", "pressure drop", "inlet temperature", "outlet temperature"]
  electrical:
    power_supply: "30 V / 10 A CC/CV bench supply"
    normal_current_ceiling_A: 3.0
    current_density_ceiling_mA_cm2: 300.0
    # Qualify to this screening limit; the 30 V supply is not the operating limit.
    # Current L0 voltage model is ~6 V at 300 mA/cm², so a 5 V ceiling would
    # prevent the RC-1 decision-current test rather than protect it.
    conservative_voltage_hard_ceiling_V: 8.0
    independent_measurements: ["DMM cell voltage", "series coulomb counter"]
  design_constraints:
    maximum_channel_pressure_drop_kPa: 50.0
    target_temperature_C: 60.0
    candidate_active_areas_cm2: [5.0, 10.0, 25.0]
    candidate_channel_depths_mm: [2.0, 3.0, 5.0]
    candidate_flow_rates_L_min: [0.1, 0.25, 0.5, 1.0]
  thermal:
    qualified_temperature_range_C: [50.0, 70.0]
    required_probes: ["catholyte reservoir", "anolyte reservoir", "cathode outlet", "anode outlet"]
  gas:
    cathode_and_anode_vents_separate: true
    external_safe_exhaust_required: true
    optional_cathode_gas_measurement_takeoff: true
    # 3 A all-HER electrical upper bound at 25 °C / 1 atm.
    maximum_hydrogen_design_rate_L_h_at_25C_1atm: 1.37
  safety:
    secondary_containment_required: true
    hydrogen_detector_required: true
    hardwired_independent_rectifier_disable_required: true
    gfci_or_rcd_required: true

required_pre_energization_tests:
  - "Dry assembly, dimensional inspection, and membrane-cassette repeatability check"
  - "Water leak and pressure test"
  - "Water flow test at three or more measured flow setpoints"
  - "Dye or conductivity step-response flow-distribution observation"
  - "Electrical dummy-load current/voltage and timestamp synchronization test"
  - "Independent shutdown proof test"
  - "Mass, pH, temperature, flow, current, and voltage MSA acceptance"

provenance:
  design_basis: "docs/REFERENCE_CELL_DESIGN_BASIS.md"
  data_contract: "docs/DATA_CONTRACT.md"
  safety_contract: "docs/INDEPENDENT_SHUTDOWN.md"
  program_gate: "docs/PROGRAM_SUMMARY.md"

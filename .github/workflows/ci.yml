name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check models/ tests/

      - name: Run tests
        run: pytest -q

      - name: Run full model suite (--quick)
        run: aq-steel --quick

      - name: Check figure count
        run: |
          count=$(find docs/figures -name '*.png' | wc -l)
          echo "Figure count: $count"
          if [ "$count" -lt 50 ]; then
            echo "::error::Expected ≥50 figures in docs/figures/, found $count"
            exit 1
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff

      - name: Lint (ruff)
        # Hard gate on real-bug (F-codes) lint. Style/complexity rules
        # (E402, E702, C901, E741) remain advisory debt by design — see
        # pyproject.toml [tool.ruff.lint] and the lint-fixes PR series.
        run: ruff check models/ tests/ --select F

      - name: Run fast-tier tests
        run: pytest -q -n auto -m "not slow"

  test-slow:
    name: Full-fidelity (slow) tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install ruff

      - name: Run slow-tier tests
        run: pytest -q -n auto -m slow

  figures:
    name: Regenerate figures
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run full model suite (--quick)
        run: aq-steel --quick

      - name: Check figure count
        run: |
          count=$(find docs/figures -name '*.png' | wc -l)
          echo "Figure count: $count"
          if [ "$count" -lt 50 ]; then
            echo "::error::Expected ≥50 figures in docs/figures/, found $count"
            exit 1
          fi
